# Netlify publica somente as páginas públicas do Florescer (pasta site/):
# política de privacidade, termos de uso e exclusão de conta.
# O app em si é Android e NÃO vai para a web.
[build]
  publish = "site"
  command = "echo sem-etapa-de-build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Sem módulos externos aqui de propósito: o SDK firebase-admin arrastava dependências que o
# empacotador não resolve (jwks-rsa chama `jose`, que é ESM, e o pacote sai CommonJS → 502).
# A função fala com o Firebase por REST, como as funções do Bússola.

[build.environment]
  # A verificação de segredos do Netlify examina o repositório inteiro e acusa a chave "AIza..."
  # do Firebase no index.html do app. Ela é a chave pública do Firebase para web: fica no app
  # de propósito, não dá acesso a dados (quem protege são as regras do Firestore) e nem faz parte
  # da pasta publicada. Só esse valor é liberado; o resto da verificação continua ativo.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCXWZOVseHAj8Lz28CrTMmhW2UzO4qArfc"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # As páginas legais são estáticas: não têm script nenhum, só estilo e a fonte do Google.
    # Com script-src 'none', mesmo que alguém consiga injetar HTML aqui, nada executa.
    Content-Security-Policy = "default-src 'self'; script-src 'none'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
